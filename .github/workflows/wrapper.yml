name: wrapper-lib

on:
  workflow_call:
    inputs:
      label:
        description: Label passed by the caller
        required: false
        type: string
        default: via-wrapper

permissions:
  contents: read

jobs:
  call-lib:
    name: call-lib
    uses: $/.github/workflows/reusable-lib.yml
    with:
      label: ${{ inputs.label }}
